<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_6 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_6" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_6');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js 3D Neural / Relational Knowledge Graph Scene
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
camera.position.z = 240;
camera.position.y = 15;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Color palette aligned with JAGA design system:
// Primary accent: #35f2a0 (Emerald Cyan / Neon Mint)
// Secondary: #8bffce, Alert: #ff5c67, Amber: #ffd166, Deep Navy Glow: #343752
const cPrimary = new THREE.Color('#35f2a0');
const cLightAccent = new THREE.Color('#8bffce');
const cWarning = new THREE.Color('#ff5c67');
const cAmber = new THREE.Color('#ffd166');
const cMuted = new THREE.Color('#3d4b70');

const group = new THREE.Group();
scene.add(group);

// Node generation: 3D multi-layered constellation / graph
const nodeCount = 95;
const nodes = [];
const nodePositions = [];

// Cluster centers simulating: Participants, Doctors, Providers, Claims clusters
const clusters = [
  { x: -50, y: 15, z: 20, color: cPrimary },
  { x: 45, y: -20, z: -30, color: cLightAccent },
  { x: 10, y: 40, z: -10, color: cAmber },
  { x: 30, y: 10, z: 40, color: cWarning }, // Anomaly / flagged cluster
  { x: -20, y: -35, z: 10, color: cMuted }
];

const sphereGeo = new THREE.SphereGeometry(1.4, 16, 16);
const coreGeo = new THREE.SphereGeometry(2.6, 16, 16);

for (let i = 0; i < nodeCount; i++) {
  const cluster = clusters[i % clusters.length];
  // Spread around cluster centers with smooth gaussian-like dispersion
  const radius = 30 + Math.random() * 45;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  
  const x = cluster.x + radius * Math.sin(phi) * Math.cos(theta) * 0.9;
  const y = cluster.y + radius * Math.sin(phi) * Math.sin(theta) * 0.7;
  const z = cluster.z + radius * Math.cos(phi) * 0.8;

  const isCore = Math.random() > 0.88;
  const color = isCore ? cluster.color : (Math.random() > 0.3 ? cPrimary : cLightAccent);
  
  const material = new THREE.MeshBasicMaterial({
    color: color,
    transparent: true,
    opacity: isCore ? 0.95 : 0.65
  });

  const mesh = new THREE.Mesh(isCore ? coreGeo : sphereGeo, material);
  mesh.position.set(x, y, z);
  group.add(mesh);

  nodes.push({
    mesh,
    basePos: new THREE.Vector3(x, y, z),
    speed: 0.2 + Math.random() * 0.5,
    phase: Math.random() * Math.PI * 2,
    isCore
  });
  nodePositions.push(new THREE.Vector3(x, y, z));
}

// Synaptic / Graph Edge Connections
const maxDistance = 42;
const linePositions = [];
const lineColors = [];
const linesMeta = [];

for (let i = 0; i < nodeCount; i++) {
  for (let j = i + 1; j < nodeCount; j++) {
    const dist = nodePositions[i].distanceTo(nodePositions[j]);
    if (dist < maxDistance) {
      linesMeta.push({ i, j, dist });
      linePositions.push(
        nodePositions[i].x, nodePositions[i].y, nodePositions[i].z,
        nodePositions[j].x, nodePositions[j].y, nodePositions[j].z
      );
      
      const c = (nodes[i].mesh.material.color.equals(cWarning) || nodes[j].mesh.material.color.equals(cWarning)) 
        ? cWarning 
        : cPrimary;
      lineColors.push(c.r, c.g, c.b, c.r, c.g, c.b);
    }
  }
}

const lineGeometry = new THREE.BufferGeometry();
lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
lineGeometry.setAttribute('color', new THREE.Float32BufferAttribute(lineColors, 3));

const lineMaterial = new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.22,
  blending: THREE.AdditiveBlending
});

const lineSegments = new THREE.LineSegments(lineGeometry, lineMaterial);
group.add(lineSegments);

// Glowing Signal Pulses traversing along edges
const pulseCount = 18;
const pulses = [];
const pulseGeo = new THREE.SphereGeometry(1.1, 8, 8);
const pulseMat = new THREE.MeshBasicMaterial({
  color: 0x8bffce,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending
});

for (let p = 0; p < pulseCount; p++) {
  const pMesh = new THREE.Mesh(pulseGeo, pulseMat);
  group.add(pMesh);
  const targetEdge = linesMeta[Math.floor(Math.random() * linesMeta.length)];
  pulses.push({
    mesh: pMesh,
    edge: targetEdge,
    progress: Math.random(),
    speed: 0.004 + Math.random() * 0.008
  });
}

// Mouse interaction for subtle parallax tilt
let targetRotX = 0;
let targetRotY = 0;
const onMouseMove = (e) => {
  const mouseX = (e.clientX / window.innerWidth) * 2 - 1;
  const mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
  targetRotY = mouseX * 0.25;
  targetRotX = -mouseY * 0.18;
};
window.addEventListener('mousemove', onMouseMove, { passive: true });

// Animation Loop
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();

  // Subtle continuous orbital drift + gentle mouse response
  group.rotation.y += 0.0018;
  group.rotation.x += (targetRotX - group.rotation.x) * 0.04;
  group.rotation.y += (targetRotY - (group.rotation.y % (Math.PI * 2))) * 0.04;

  // Gentle breathing of individual nodes
  const posAttr = lineSegments.geometry.attributes.position;
  let lineIdx = 0;

  for (let i = 0; i < nodes.length; i++) {
    const node = nodes[i];
    const wave = Math.sin(elapsedTime * node.speed + node.phase);
    node.mesh.position.y = node.basePos.y + wave * 2.2;
    node.mesh.position.x = node.basePos.x + Math.cos(elapsedTime * 0.4 + node.phase) * 1.5;
    
    // Core nodes subtle pulsing scale
    if (node.isCore) {
      const s = 1 + Math.sin(elapsedTime * 2.0 + node.phase) * 0.2;
      node.mesh.scale.set(s, s, s);
    }
  }

  // Update dynamic line positions to match floating nodes
  for (let e = 0; e < linesMeta.length; e++) {
    const edge = linesMeta[e];
    const nA = nodes[edge.i].mesh.position;
    const nB = nodes[edge.j].mesh.position;

    posAttr.array[lineIdx++] = nA.x;
    posAttr.array[lineIdx++] = nA.y;
    posAttr.array[lineIdx++] = nA.z;

    posAttr.array[lineIdx++] = nB.x;
    posAttr.array[lineIdx++] = nB.y;
    posAttr.array[lineIdx++] = nB.z;
  }
  posAttr.needsUpdate = true;

  // Traverse signals across synaptic lines
  for (let p = 0; p < pulses.length; p++) {
    const pulse = pulses[p];
    pulse.progress += pulse.speed;
    if (pulse.progress >= 1) {
      pulse.progress = 0;
      pulse.edge = linesMeta[Math.floor(Math.random() * linesMeta.length)];
    }
    if (pulse.edge) {
      const pA = nodes[pulse.edge.i].mesh.position;
      const pB = nodes[pulse.edge.j].mesh.position;
      pulse.mesh.position.lerpVectors(pA, pB, pulse.progress);
    }
  }

  renderer.render(scene, camera);
}

animate();

const handleResize = () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
};
window.addEventListener('resize', handleResize);

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_6 -->
</body>
</html>
